<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Odoo PRIAT · Implementación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; } body { margin: 0; } [hidden] { display: none !important; } img { max-width: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: barra superior con fases y pestañas; cada vista es una mesa de trabajo de ancho completo, resumen arriba y detalle abajo. */
/* Paleta propia del proyecto: grafito frío + azul tinta como acento; estados en verde, ámbar y rojo. */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --panel-2: #f6f7f9; --line: #e2e5ea; --line-2: #cfd4dc;
  --fg: #141821; --muted: #5b6372; --faint: #8c93a1;
  --accent: #2446a6; --accent-2: #3a5cc0; --accent-soft: #e8edfa; --on-accent: #ffffff;
  --verde: #1d7f52; --verde-soft: #e1f2e9; --ambar: #9a6408; --ambar-soft: #fbf0d9; --rojo: #c2362b; --rojo-soft: #fbe7e4;
  --azul: #2446a6; --azul-soft: #e8edfa; --logo: #141821;
  --f1: #2446a6; --f2: #0f8a7e; --f3: #5b3fb8; --f4: #c2602a; --f5: #6b7a1e; --f6: #b4307a; --f7: #1b7fb5; --f8: #8a5a12; --f9: #3c4d63; --f10: #a83a3a;
  --sombra: 0 1px 2px rgba(15,20,30,.05), 0 10px 30px rgba(15,20,30,.08);
  --f-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --f-ui: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --panel: #161a21; --panel-2: #1d222b; --line: #272d37; --line-2: #343b47;
  --fg: #e8ebf0; --muted: #9ea6b4; --faint: #6f7786;
  --accent: #8ea8ff; --accent-2: #a9bcff; --accent-soft: #1b2440; --on-accent: #0b1020;
  --verde: #5ccb92; --verde-soft: #13291f; --ambar: #e6ad4f; --ambar-soft: #33280f; --rojo: #f07d72; --rojo-soft: #35191a;
  --azul: #8ea8ff; --azul-soft: #1b2440; --logo: #e8ebf0;
  --f1: #8ea8ff; --f2: #4fd1c1; --f3: #b39cff; --f4: #f0995f; --f5: #b8c75a; --f6: #f07fbd; --f7: #6cc0ef; --f8: #d9a85b; --f9: #9fb0c8; --f10: #f08a8a;
  --sombra: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161a21; --panel-2: #1d222b; --line: #272d37; --line-2: #343b47;
  --fg: #e8ebf0; --muted: #9ea6b4; --faint: #6f7786;
  --accent: #8ea8ff; --accent-2: #a9bcff; --accent-soft: #1b2440; --on-accent: #0b1020;
  --verde: #5ccb92; --verde-soft: #13291f; --ambar: #e6ad4f; --ambar-soft: #33280f; --rojo: #f07d72; --rojo-soft: #35191a;
  --azul: #8ea8ff; --azul-soft: #1b2440; --logo: #e8ebf0;
  --f1: #8ea8ff; --f2: #4fd1c1; --f3: #b39cff; --f4: #f0995f; --f5: #b8c75a; --f6: #f07fbd; --f7: #6cc0ef; --f8: #d9a85b; --f9: #9fb0c8; --f10: #f08a8a;
  --sombra: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.45); color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 12px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { height: 26px; width: auto; color: var(--logo); flex: none; overflow: hidden; }
.brand .sep { width: 1px; height: 30px; background: var(--line-2); }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 650; font-size: 15px; flex: none; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 650; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; font-family: var(--f-ui); }
.fases { display: flex; align-items: stretch; flex: 1 1 420px; min-width: 0; gap: 3px; }
.fase { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.fase b { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fase span { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.fase .fill { position: absolute; inset: auto 0 0 0; height: 3px; background: var(--line-2); }
.fase .fill i { display: block; height: 100%; background: var(--accent); }
.fase.now { border-color: var(--accent); background: var(--accent-soft); }
.quien { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-left: auto; }
.tema { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; width: 30px; height: 28px; font-size: 14px; color: var(--muted); }
.tema:hover { color: var(--fg); }
.quien .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.quien .dot.on { background: var(--verde); }
.tabs { display: flex; gap: 2px; width: 100%; overflow-x: auto; scrollbar-width: none; margin-top: 4px; }
.tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--fg); }
.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); }
.tabs a .n { font-family: var(--f-mono); font-size: 11px; color: var(--faint); margin-left: 4px; }

main { padding-block: 22px 60px; }
.view { display: grid; gap: 22px; }
h2 { font-family: var(--f-display); font-weight: 650; font-size: 19px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .02em; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.pad { padding: 16px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* Pastillas de estado */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 0; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-pendiente { background: var(--panel-2); color: var(--muted); }
.s-en_curso { background: var(--azul-soft); color: var(--azul); }
.s-atorada { background: var(--rojo-soft); color: var(--rojo); }
.s-hecha { background: var(--verde-soft); color: var(--verde); }
.sem-verde { background: var(--verde-soft); color: var(--verde); }
.sem-ambar { background: var(--ambar-soft); color: var(--ambar); }
.sem-rojo { background: var(--rojo-soft); color: var(--rojo); }

/* Resumen: cabecera */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.hero .lead { padding: 20px; display: grid; gap: 14px; align-content: start; }
.hero .lead h2 { font-size: 24px; line-height: 1.15; }
.hero .lead p { margin: 0; color: var(--muted); max-width: 60ch; }
.gauge { display: flex; align-items: center; gap: 16px; }
.gauge svg { flex: none; }
.gauge .big { font-family: var(--f-display); font-size: 34px; font-weight: 650; line-height: 1; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.stat { background: var(--panel); padding: 16px; display: grid; gap: 4px; align-content: start; }
.stat b { font-family: var(--f-display); font-size: 30px; font-weight: 650; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12.5px; }
.stat.alerta b { color: var(--rojo); }

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.kpi { padding: 14px 14px 12px; display: grid; gap: 6px; position: relative; }
.kpi .v { font-family: var(--f-mono); font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
.kpi .v small { font-size: 12px; color: var(--muted); font-family: var(--f-ui); letter-spacing: 0; margin-left: 4px; }
.kpi .n { font-size: 13px; font-weight: 500; padding-right: 22px; }
.kpi .src { font-size: 11.5px; color: var(--faint); display: flex; justify-content: space-between; gap: 8px; }
.kpi .bar { height: 4px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.kpi .bar i { display: block; height: 100%; border-radius: 4px; }
.kpi button.edit { position: absolute; top: 10px; right: 10px; border: 0; background: none; color: var(--faint); font-size: 12px; padding: 2px 6px; border-radius: 6px; }
.kpi button.edit:hover { background: var(--panel-2); color: var(--fg); }
.kpi .delta { font-family: var(--f-mono); font-size: 11.5px; }

/* Frentes */
.frentes { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.frente { padding: 14px; display: grid; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; transition: border-color .15s, box-shadow .15s; }
.frente:hover { border-color: var(--line-2); box-shadow: var(--sombra); }
.frente .t { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.frente h3 { font-family: var(--f-display); font-size: 16px; font-weight: 650; letter-spacing: -.005em; }
.frente .who { font-size: 12px; color: var(--muted); }
.prog { display: flex; align-items: center; gap: 10px; }
.prog .track { flex: 1; height: 6px; background: var(--panel-2); border-radius: 6px; overflow: hidden; display: flex; }
.prog .track i { display: block; height: 100%; }
.prog b { font-family: var(--f-mono); font-size: 12px; font-weight: 500; min-width: 38px; text-align: right; }
.frente .next { font-size: 12.5px; display: grid; gap: 2px; }
.frente .next span { color: var(--muted); }
.frente .why { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--line-2); padding-left: 8px; }
.frente .why.rojo { border-color: var(--rojo); }
.frente .why.ambar { border-color: var(--ambar); }
.frente .counts { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.frente .counts b { font-family: var(--f-mono); font-weight: 500; color: var(--fg); }

.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.list { display: grid; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 14px; border-top: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.li:first-child { border-top: 0; }
button.li:hover { background: var(--panel-2); }
.li .tx { min-width: 0; }
.li .tx b { font-weight: 500; display: block; }
.li .tx span { font-size: 12px; color: var(--muted); }
.li .dt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.li .dt.late { color: var(--rojo); }
.chip-f { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); font-weight: 500; white-space: nowrap; border: 1px solid var(--line); }
.fdot { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 7px; vertical-align: 1px; flex: none; }
.chip-f .fdot { margin-right: 0; }
.dot-s { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: none; }

.feed .li { grid-template-columns: 34px minmax(0, 1fr); }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--on-accent); background: var(--accent-2); }

/* Plan (Gantt) */
.gantt { overflow-x: auto; }
.g { display: grid; min-width: 980px; }
.g .row { display: grid; grid-template-columns: 250px 1fr; border-top: 1px solid var(--line); min-height: 34px; }
.g .row.head { position: sticky; top: 0; border-top: 0; background: var(--panel); z-index: 1; }
.g .lbl { padding: 7px 14px; font-size: 13px; display: flex; align-items: center; gap: 8px; min-width: 0; border-right: 1px solid var(--line); }
.g .lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g .grp .lbl { font-family: var(--f-display); font-weight: 650; font-size: 14px; background: var(--panel-2); }
.g .grp .lane { background: var(--panel-2); }
.g .lane { position: relative; }
.g .weeks { display: grid; height: 100%; }
.g .weeks div { border-left: 1px solid var(--line); font-size: 10.5px; color: var(--faint); padding: 4px 4px; font-family: var(--f-mono); white-space: nowrap; overflow: hidden; }
.g .weeks div.m { color: var(--muted); font-weight: 500; }
.g .weeks div.hoy { background: var(--accent-soft); color: var(--accent); }
.g .gl { position: absolute; inset: 0; display: grid; pointer-events: none; }
.g .gl div { border-left: 1px solid var(--line); }
.bar-e { position: absolute; top: 7px; height: 20px; border-radius: 6px; font-size: 11px; padding: 0 7px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; font-weight: 500; border: 1px solid transparent; }
.bar-e.hecha { background: var(--verde-soft); color: var(--verde); }
.bar-e.en_curso { background: var(--azul-soft); color: var(--azul); }
.bar-e.pendiente { background: var(--panel-2); color: var(--muted); border-color: var(--line-2); }
.bar-e.late { background: var(--rojo-soft); color: var(--rojo); }
.bar-e.prop { border-style: dashed; border-color: currentColor; }
.bar-e.clip { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.todayline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: .7; pointer-events: none; z-index: 2; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Tareas (tablero) */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--panel); padding: 5px 10px; border-radius: 999px; font-size: 12.5px; color: var(--muted); }
.seg button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.inp { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 10px; min-width: 0; }
.inp:focus { border-color: var(--accent); outline: none; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--line-2); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.pri:hover { background: var(--accent-2); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.add { display: grid; grid-template-columns: minmax(0, 1fr) 170px 140px 140px auto; gap: 8px; padding: 10px; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; align-items: start; }
.col { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 8px; display: grid; gap: 8px; min-height: 120px; align-content: start; }
.col.drop { border-color: var(--accent); background: var(--accent-soft); }
.col .ch { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; }
.col .ch .mono { font-size: 12px; color: var(--muted); }
.tk { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 7px; text-align: left; width: 100%; }
.tk:hover { border-color: var(--line-2); box-shadow: var(--sombra); }
.tk[draggable="true"] { cursor: grab; }
.tk .tt { font-weight: 500; line-height: 1.35; }
.tk .mt { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.tk .mt .dt.late { color: var(--rojo); font-weight: 500; }
.tk .motivo { font-size: 12px; color: var(--rojo); background: var(--rojo-soft); padding: 5px 8px; border-radius: 7px; }
.tk .chk { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--panel); display: grid; place-items: center; flex: none; padding: 0; color: transparent; }
.tk .chk.on { background: var(--verde); border-color: var(--verde); color: #fff; }
.tk .top-r { display: flex; gap: 8px; align-items: start; }
.more { width: 100%; border: 1px dashed var(--line-2); background: none; border-radius: 10px; padding: 7px; color: var(--muted); font-size: 12.5px; }

/* Semanas */
.wk { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 0; overflow: hidden; }
.wk .side { padding: 18px; border-right: 1px solid var(--line); background: var(--panel-2); display: grid; gap: 10px; align-content: start; }
.wk .side .num { font-family: var(--f-display); font-size: 28px; font-weight: 650; line-height: 1; }
.wk .body { padding: 18px; display: grid; gap: 16px; min-width: 0; }
.wk .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.wk ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.wk textarea { width: 100%; min-height: 70px; resize: vertical; }
.bf { display: grid; gap: 6px; }
.bf .row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.bf .row b { font-weight: 500; }
.ministat { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.ministat b { font-family: var(--f-mono); color: var(--fg); font-weight: 500; }

/* Procesos */
.matriz { overflow-x: auto; }
.matriz table { width: 100%; border-collapse: collapse; min-width: 760px; }
.matriz th, .matriz td { padding: 10px 12px; border-top: 1px solid var(--line); text-align: left; font-size: 13px; vertical-align: middle; }
.matriz th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; border-top: 0; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; min-width: 260px; }
.steps button { height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); font-size: 11px; color: var(--faint); padding: 0 4px; }
.steps button.on { background: var(--verde-soft); border-color: transparent; color: var(--verde); font-weight: 600; }
.steps button.cur { background: var(--verde); color: #fff; }
.steps button:disabled { cursor: default; }

/* Decisiones */
.dec .li { grid-template-columns: auto minmax(0, 1fr) auto; }

/* Buzón */
.buzon { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
.compose { padding: 16px; display: grid; gap: 10px; position: sticky; top: 120px; }
.compose textarea { min-height: 150px; resize: vertical; width: 100%; line-height: 1.5; }
.compose .acc { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mic { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 7px 14px; font-weight: 500; }
.mic .rec { width: 10px; height: 10px; border-radius: 50%; background: var(--rojo); }
.mic.on { background: var(--rojo-soft); border-color: var(--rojo); color: var(--rojo); }
.mic.on .rec { animation: pulso 1s ease-in-out infinite; }
@keyframes pulso { 50% { opacity: .25; } }
.parcial { font-size: 13px; color: var(--faint); font-style: italic; min-height: 1.2em; }
.nota { padding: 14px 16px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.nota:first-child { border-top: 0; }
.nota .cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.nota .cuerpo { white-space: pre-wrap; line-height: 1.5; }
.nota .resp { background: var(--accent-soft); border-radius: 10px; padding: 9px 12px; font-size: 13px; white-space: pre-wrap; }
.nota .resp b { color: var(--accent); font-weight: 600; display: block; font-size: 12px; margin-bottom: 2px; }
.s-nueva { background: var(--ambar-soft); color: var(--ambar); }
.s-leida { background: var(--azul-soft); color: var(--azul); }
.s-aplicada { background: var(--verde-soft); color: var(--verde); }
@media (max-width: 900px) { .buzon { grid-template-columns: 1fr; } .compose { position: static; } }

/* Identidad y edición */
.yo { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 500; }
.ava { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; flex: none; }
.ava.lg { width: 56px; height: 56px; font-size: 18px; }
.quien-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.quien-pick button { border: 1.5px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px 8px; display: grid; justify-items: center; gap: 8px; font-weight: 500; }
.quien-pick button.on { border-color: var(--accent); background: var(--accent-soft); }
.err { color: var(--rojo); font-size: 13px; min-height: 1.2em; margin: 0; }
.pie { padding-block: 0 40px; color: var(--faint); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.pie a { color: var(--muted); }

.candado { max-width: 420px; margin: 40px auto; padding: 28px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.candado svg { color: var(--accent); }
.lock-f { display: grid; gap: 10px; width: 100%; }
.rec-l { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; justify-content: center; }

/* Panel lateral */
.scrim { position: fixed; inset: 0; background: rgba(15,10,20,.35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); z-index: 41; box-shadow: var(--sombra); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer header { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.drawer .bd { padding: 16px 18px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.drawer footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.fld { display: grid; gap: 5px; }
.fld label { font-size: 12px; color: var(--muted); font-weight: 500; }
.fld .inp { width: 100%; }
.fld textarea.inp { min-height: 80px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.x { border: 0; background: none; font-size: 20px; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; }
.x:hover { background: var(--panel-2); }
.hist { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: var(--sombra); }
.banner { padding: 10px 14px; border-radius: 10px; background: var(--ambar-soft); color: var(--ambar); font-size: 13px; }

@media (max-width: 1000px) {
  .hero { grid-template-columns: 1fr; }
  .cols { grid-template-columns: 1fr; }
  .add { grid-template-columns: 1fr 1fr; }
  .add .inp:first-child { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fases { display: none; }
  .wk { grid-template-columns: 1fr; }
  .wk .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .wk .grid2 { grid-template-columns: 1fr; }
  .bf .row { grid-template-columns: 1fr; gap: 2px; }
  .kanban { grid-template-columns: repeat(4, minmax(78vw, 1fr)); }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const weekNum = (d) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const num = (n) => n == null ? "—" : Number(n).toLocaleString("es-MX");
const late = (t) => t.estado !== "hecha" && t.fecha && parse(t.fecha) < today();
const nowISO = () => new Date().toISOString();
const initials = (s) => (s || "?").split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const byOrden = (a, b) => (a.orden ?? 0) - (b.orden ?? 0);
const frenteDe = (id) => S.frentes.find((f) => f.id === id);
const fname = (id) => frenteDe(id)?.nombre || id;
const fcol = (id) => { const f = frenteDe(id); return `var(--f${((f?.orden ?? 8) % 10) + 1})`; };
const ago = (s) => { if (!s) return ""; const m = Math.round((Date.now() - new Date(s)) / 6e4); if (m < 1) return "ahora"; if (m < 60) return `hace ${m} min`; const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`; const d = Math.round(h / 24); return d === 1 ? "ayer" : `hace ${d} días`; };
function toast(msg) { const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }

// ---------- Cálculos ----------
function statsFrente(fid) {
  const ts = S.tareas.filter((t) => t.frente === fid);
  const c = { total: ts.length, hecha: 0, en_curso: 0, atorada: 0, pendiente: 0, late: 0 };
  ts.forEach((t) => { c[t.estado] = (c[t.estado] || 0) + 1; if (late(t)) c.late++; });
  c.pct = c.total ? Math.round((c.hecha / c.total) * 100) : 0;
  return c;
}
function statsGlobal() {
  const c = { total: S.tareas.length, hecha: 0, atorada: 0, en_curso: 0, late: 0, semana: 0 };
  const w0 = monday(today()), w1 = addDays(w0, 7);
  S.tareas.forEach((t) => { if (t.estado === "hecha") c.hecha++; if (t.estado === "atorada") c.atorada++; if (t.estado === "en_curso") c.en_curso++; if (late(t)) c.late++;
    if (t.hecha_at) { const d = new Date(t.hecha_at); if (d >= w0 && d < w1) c.semana++; } });
  c.pct = c.total ? Math.round((c.hecha / c.total) * 100) : 0;
  return c;
}
function nextEtapa(fid) {
  const es = S.etapas.filter((e) => e.frente === fid && e.estado !== "hecha").sort((a, b) => (a.fin || "").localeCompare(b.fin || ""));
  return es[0];
}

// ---------- Fases ----------
function renderFases() {
  const t = today();
  $("#fases").innerHTML = FASES.map((f) => {
    const a = parse(f.ini), b = parse(f.fin); const p = Math.max(0, Math.min(1, (t - a) / (b - a + 864e5)));
    const now = t >= a && t <= b;
    return `<div class="fase${now ? " now" : ""}" title="${esc(f.n)} · ${esc(f.d)}"><b>${esc(f.n)}</b><span>${esc(f.d)}${now ? " · ahora" : ""}</span><div class="fill"><i style="width:${(p * 100).toFixed(0)}%"></i></div></div>`;
  }).join("");
}

// ---------- Vistas ----------
function render() {
  renderFases();
  const nn = S.notas.filter((x) => x.estado === "nueva").length; const nb = $("#nNotas"); if (nb) nb.textContent = nn ? nn : "";
  document.querySelectorAll("#tabs a").forEach((a) => a.classList.toggle("on", a.dataset.v === view));
  const main = $("#main");
  const ready = COLS.every((c) => loaded.has(c));
  if (!DK) { main.innerHTML = vCandado(); bindCandado(); return; }
  if (!ready) {
    main.innerHTML = `<div class="card empty">${loadError ? "No se pudo cargar el tablero. Revisa tu conexión y recarga la página." : "Cargando el tablero…"}</div>`;
    return;
  }
  const fn = { resumen: vResumen, plan: vPlan, tareas: vTareas, semanas: vSemanas, procesos: vProcesos, decisiones: vDecisiones, buzon: vBuzon }[view] || vResumen;
  main.innerHTML = `<div class="view">${fn()}</div>`;
  bindView();
}

function gaugeSVG(p) {
  const r = 30, c = 2 * Math.PI * r, off = c * (1 - p / 100);
  return `<svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--panel-2)" stroke-width="8"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 38 38)"/></svg>`;
}

function vResumen() {
  const g = statsGlobal();
  const t = today(); const goLive = parse("2027-01-04"); const dias = Math.max(0, Math.round((goLive - t) / 864e5));
  const w0 = monday(t);
  const hechasSemana = S.tareas.filter((x) => x.hecha_at && new Date(x.hecha_at) >= w0).sort((a, b) => b.hecha_at.localeCompare(a.hecha_at));
  const atoradas = S.tareas.filter((x) => x.estado === "atorada" || late(x)).sort((a, b) => (a.estado === "atorada" ? -1 : 1) - (b.estado === "atorada" ? -1 : 1) || (a.fecha || "").localeCompare(b.fecha || ""));
  const lim = addDays(t, 21);
  const proximos = S.etapas.filter((e) => e.estado !== "hecha" && parse(e.fin) >= t && parse(e.fin) <= lim).sort((a, b) => a.fin.localeCompare(b.fin));
  const proxT = S.tareas.filter((x) => x.estado !== "hecha" && x.fecha && parse(x.fecha) >= t && parse(x.fecha) <= lim);
  const decAb = S.decisiones.filter((d) => d.estado !== "decidida").length;

  return `
  <section class="hero">
    <div class="card lead">
      <div class="eyebrow">Hoy · ${fmtY(iso(t))} · semana ${weekNum(t)}</div>
      <h2>Contabilidad de las 45 razones sociales en Odoo, con Compac solo de respaldo, en enero de 2027.</h2>
      <div class="gauge">${gaugeSVG(g.pct)}<div><div class="big mono">${g.pct}%</div><div class="muted">${num(g.hecha)} de ${num(g.total)} tareas terminadas</div></div></div>
    </div>
    <div class="stats">
      <div class="stat"><b class="mono">${dias}</b><span>días para Odoo principal (meta 4 ene)</span></div>
      <div class="stat"><b class="mono">${g.semana}</b><span>tareas terminadas esta semana</span></div>
      <div class="stat ${g.atorada + g.late ? "alerta" : ""}"><b class="mono">${g.atorada + g.late}</b><span>atoradas o vencidas</span></div>
      <div class="stat"><b class="mono">${decAb}</b><span>decisiones pendientes</span></div>
    </div>
  </section>

  <section>
    <div class="sec-h"><h2>Indicadores</h2><p>De Odoo y del correo de dirección. ${canWrite ? "Toca ✎ para registrar un valor nuevo." : ""}</p></div>
    <div class="kpis">${S.indicadores.sort(byOrden).map(kpiCard).join("")}</div>
  </section>

  <section>
    <div class="sec-h"><h2>Frentes</h2><p>Toca un frente para ver sus tareas.</p></div>
    <div class="frentes">${S.frentes.sort(byOrden).map(frenteCard).join("")}</div>
  </section>

  <section class="cols">
    <div class="card">
      <div class="pad sec-h" style="margin:0"><h3>Terminado esta semana</h3><span class="mono faint">${hechasSemana.length}</span></div>
      <div class="list">${hechasSemana.length ? hechasSemana.slice(0, 12).map((x) => liTask(x, fmt(x.hecha_at))).join("") : `<div class="empty">Aún no se termina nada esta semana.</div>`}</div>
    </div>
    <div class="card">
      <div class="pad sec-h" style="margin:0"><h3>Atorado y por qué</h3><span class="mono faint">${atoradas.length}</span></div>
      <div class="list">${atoradas.length ? atoradas.slice(0, 12).map((x) => liTask(x, x.fecha ? fmt(x.fecha) : "", true)).join("") : `<div class="empty">Nada atorado.</div>`}</div>
    </div>
    <div class="card">
      <div class="pad sec-h" style="margin:0"><h3>Próximos compromisos (3 semanas)</h3><span class="mono faint">${proximos.length + proxT.length}</span></div>
      <div class="list">
        ${proximos.map((e) => `<button class="li" data-frente="${esc(e.frente)}"><span class="dot-s" style="background:var(--accent)"></span><span class="tx"><b>${esc(e.nombre)}</b><span>${esc(fname(e.frente))} · etapa${e.confirmada ? "" : " · fecha por confirmar"}</span></span><span class="dt">${fmt(e.fin)}</span></button>`).join("")}
        ${proxT.map((x) => liTask(x, fmt(x.fecha))).join("")}
        ${!proximos.length && !proxT.length ? `<div class="empty">Sin compromisos con fecha en las próximas 3 semanas.</div>` : ""}
      </div>
    </div>
  </section>

  <section class="card feed">
    <div class="pad sec-h" style="margin:0"><h3>Movimientos recientes</h3><span class="faint">quién movió qué</span></div>
    <div class="list">${S.actividad.length ? S.actividad.sort((a, b) => (b.at || "").localeCompare(a.at || "")).slice(0, 10).map((a) => `<div class="li">${avatar(a.por)}<span class="tx"><b>${esc(a.texto)}</b><span>${esc(who(a.por))} · ${ago(a.at)}${a.frente ? " · " + esc(fname(a.frente)) : ""}</span></span></div>`).join("") : `<div class="empty">Aquí aparecerá cada cambio que haga el equipo.</div>`}</div>
  </section>`;
}

function who(id) { if (!id) return "Carga inicial"; if (id === "claude") return "Claude"; const e = EDITORES.find((x) => x.id === id); return e ? e.nombre : (names[id] || "Alguien del equipo"); }

function kpiCard(k) {
  const h = (k.historial || []).slice().sort((a, b) => a.fecha.localeCompare(b.fecha));
  const prev = h.length > 1 ? h[h.length - 2].valor : null;
  const d = prev == null ? null : k.valor - prev;
  const good = d == null || d === 0 ? null : (k.direccion === "bajar" ? d < 0 : d > 0);
  let pct = null, color = "var(--accent)";
  if (k.meta != null) {
    if (k.direccion === "subir") pct = k.meta ? k.valor / k.meta : 0;
    else { const base = h.length ? Math.max(...h.map((x) => x.valor)) : k.valor; pct = base ? 1 - k.valor / base : 1; }
    pct = Math.max(0, Math.min(1, pct));
    color = k.direccion === "bajar" ? (k.valor === 0 ? "var(--verde)" : "var(--rojo)") : (pct >= 1 ? "var(--verde)" : "var(--accent)");
  }
  return `<div class="card kpi">
    ${canWrite ? `<button class="edit" data-kpi="${esc(k.id)}" aria-label="Registrar valor de ${esc(k.nombre)}">✎</button>` : ""}
    <div class="n">${esc(k.nombre)}</div>
    <div class="v">${num(k.valor)}<small>${esc(k.unidad || "")}${k.meta != null ? ` · meta ${num(k.meta)}` : ""}</small></div>
    ${pct != null ? `<div class="bar"><i style="width:${Math.max(3, pct * 100).toFixed(0)}%;background:${color}"></i></div>` : ""}
    <div class="src"><span>${esc(k.fuente || "")}</span>${d != null && d !== 0 ? `<span class="delta" style="color:${good ? "var(--verde)" : "var(--rojo)"}">${d > 0 ? "+" : ""}${num(d)}</span>` : ""}</div>
  </div>`;
}

function frenteCard(f) {
  const c = statsFrente(f.id); const ne = nextEtapa(f.id);
  const w = (n) => c.total ? (n / c.total * 100).toFixed(1) : 0;
  return `<button class="frente" data-frente="${esc(f.id)}">
    <div class="t"><div><h3><span class="fdot" style="background:${fcol(f.id)}"></span>${esc(f.nombre)}</h3><div class="who">${esc(f.lider || "Sin líder")}${f.equipo ? " · " + esc(f.equipo) : ""}</div></div><span class="pill sem-${esc(f.semaforo || "verde")}">${SEM[f.semaforo] || "En tiempo"}</span></div>
    <div class="prog"><div class="track"><i style="width:${w(c.hecha)}%;background:var(--verde)"></i><i style="width:${w(c.en_curso)}%;background:var(--azul);opacity:.55"></i><i style="width:${w(c.atorada)}%;background:var(--rojo);opacity:.7"></i></div><b>${c.pct}%</b></div>
    <div class="counts"><span><b>${c.hecha}</b> hechas</span><span><b>${c.en_curso}</b> en curso</span><span><b>${c.pendiente}</b> por hacer</span>${c.atorada ? `<span style="color:var(--rojo)"><b style="color:var(--rojo)">${c.atorada}</b> atoradas</span>` : ""}${c.late ? `<span style="color:var(--rojo)"><b style="color:var(--rojo)">${c.late}</b> vencidas</span>` : ""}</div>
    ${ne ? `<div class="next"><span>Siguiente etapa</span><b>${esc(ne.nombre)} · <span class="mono" style="color:${parse(ne.fin) < today() ? "var(--rojo)" : "var(--muted)"}">${fmt(ne.fin)}${ne.confirmada ? "" : " (por confirmar)"}</span></b></div>` : ""}
    ${f.motivo && f.semaforo !== "verde" ? `<div class="why ${esc(f.semaforo)}">${esc(f.motivo)}</div>` : ""}
  </button>`;
}

function liTask(x, dt, showWhy) {
  const col = { hecha: "var(--verde)", en_curso: "var(--azul)", atorada: "var(--rojo)", pendiente: "var(--faint)" }[x.estado];
  const sub = showWhy && x.motivo ? x.motivo : `${fname(x.frente)}${x.responsable ? " · " + x.responsable : ""}`;
  return `<button class="li" data-task="${esc(x.id)}"><span class="dot-s" style="background:${col}"></span><span class="tx"><b>${esc(x.texto)}</b><span>${esc(sub)}${showWhy && late(x) && x.estado !== "atorada" ? " · vencida" : ""}</span></span><span class="dt${late(x) ? " late" : ""}">${esc(dt || "")}</span></button>`;
}

// Plan
function vPlan() {
  const start = monday(parse("2026-10-26")), weeks = 15; const end = addDays(start, weeks * 7);
  const total = end - start; const t = today();
  const pos = (d) => ((d - start) / total) * 100;
  const wk = [...Array(weeks)].map((_, i) => addDays(start, i * 7));
  const tpos = pos(t);
  const head = wk.map((d) => { const isNow = t >= d && t < addDays(d, 7); return `<div class="${d.getDate() <= 7 ? "m" : ""}${isNow ? " hoy" : ""}">${d.getDate()} ${MES[d.getMonth()]}</div>`; }).join("");
  const gridCols = `grid-template-columns:repeat(${weeks},1fr)`;
  const gl = `<div class="gl" style="${gridCols}">${wk.map(() => "<div></div>").join("")}</div>`;
  let rows = "";
  S.frentes.sort(byOrden).forEach((f) => {
    const es = S.etapas.filter((e) => e.frente === f.id).sort(byOrden);
    const c = statsFrente(f.id);
    rows += `<div class="row grp"><div class="lbl"><span class="fdot" style="background:${fcol(f.id)}"></span><span>${esc(f.nombre)}</span><span class="pill sem-${esc(f.semaforo)}" style="margin-left:auto">${c.pct}%</span></div><div class="lane">${gl}${tpos >= 0 && tpos <= 100 ? `<div class="todayline" style="left:${tpos}%"></div>` : ""}</div></div>`;
    es.forEach((e) => {
      const a = parse(e.inicio), b = addDays(parse(e.fin), 1);
      const clip = a < start; const l = Math.max(0, pos(a)), r = Math.min(100, pos(b));
      const isLate = e.estado !== "hecha" && parse(e.fin) < t;
      const cls = `${isLate ? "late" : e.estado}${e.confirmada ? "" : " prop"}${clip ? " clip" : ""}`;
      const bar = b <= start ? `<div class="bar-e ${cls}" style="left:0;width:auto;max-width:100%" title="${esc(e.nombre)}">← ${esc(fmt(e.fin))} · ${esc(e.nombre)}</div>`
        : `<div class="bar-e ${cls}" style="left:${l}%;width:max(${(r - l).toFixed(2)}%, 14px)" title="${esc(e.nombre)} · ${fmt(e.inicio)} → ${fmt(e.fin)}${e.confirmada ? "" : " (por confirmar)"}">${r - l > 9 ? esc(fmt(e.fin)) : ""}</div>`;
      rows += `<div class="row"><div class="lbl" ${canWrite ? `data-etapa="${esc(e.id)}" style="cursor:pointer"` : ""}><span class="dot-s" style="margin:0;background:${isLate ? "var(--rojo)" : e.estado === "hecha" ? "var(--verde)" : e.estado === "en_curso" ? "var(--azul)" : "var(--faint)"}"></span><span title="${esc(e.nombre)}">${esc(e.nombre)}</span></div><div class="lane">${gl}${tpos >= 0 && tpos <= 100 ? `<div class="todayline" style="left:${tpos}%"></div>` : ""}${bar}</div></div>`;
    });
  });
  return `<section>
    <div class="sec-h"><h2>Plan por frente</h2>
      <div class="legend"><span><i style="background:var(--verde-soft)"></i>Hecha</span><span><i style="background:var(--azul-soft)"></i>En curso</span><span><i style="background:var(--panel-2);border:1px solid var(--line-2)"></i>Por hacer</span><span><i style="background:var(--rojo-soft)"></i>Vencida</span><span><i style="border:1px dashed var(--muted)"></i>Fecha por confirmar</span><span><i style="background:var(--accent);width:2px"></i>Hoy</span></div>
    </div>
    <div class="card gantt"><div class="g">
      <div class="row head"><div class="lbl"><span class="eyebrow">Frente / etapa</span></div><div class="lane"><div class="weeks" style="${gridCols}">${head}</div></div></div>
      ${rows}
    </div></div>
    <p class="muted" style="margin-top:10px">Las fechas en Odoo y las de la junta del 16-nov están confirmadas; las punteadas son propuestas para acordar con el equipo. ${canWrite ? "Toca el nombre de una etapa para cambiar sus fechas o su estado." : ""}</p>
  </section>`;
}

// Tareas
function vTareas() {
  const resps = [...new Set(S.tareas.map((t) => t.responsable).filter(Boolean))].sort();
  let ts = S.tareas.filter((t) => (filt.frente === "todos" || t.frente === filt.frente) && (!filt.resp || t.responsable === filt.resp) && (!filt.q || (t.texto + " " + (t.nota || "")).toLowerCase().includes(filt.q.toLowerCase())));

    let items = ts.filter((t) => t.estado === k).sort((a, b) => (late(b) - late(a)) || (a.fecha || "9").localeCompare(b.fecha || "9") || byOrden(a, b));

    return `<div class="col" data-col="${k}"><div class="ch"><span class="pill s-${k}">${n}</span><span class="mono">${total}</span></div>
      ${items.slice(0, cap).map(taskCard).join("") || `<div class="faint" style="padding:6px 8px;font-size:12.5px">Vacío</div>`}
      ${total > cap ? `<button class="more" data-act="verHechas">Ver las ${total} hechas</button>` : ""}</div>`;
  }).join("");
  return `<section class="view" style="gap:12px">
    <div class="sec-h" style="margin:0"><h2>Tareas</h2><p>${canWrite ? "Arrastra una tarjeta para cambiarla de columna, o tócala para editarla." : "Toca una tarjeta para ver su detalle."}</p></div>
    <div class="toolbar">
      <div class="seg" id="segF"><button data-f="todos" class="${filt.frente === "todos" ? "on" : ""}">Todos</button>${S.frentes.sort(byOrden).map((f) => `<button data-f="${esc(f.id)}" class="${filt.frente === f.id ? "on" : ""}">${esc(f.nombre)}</button>`).join("")}</div>
    </div>
    <div class="toolbar">
      <select class="inp" id="fResp" aria-label="Responsable"><option value="">Todos los responsables</option>${resps.map((r) => `<option ${filt.resp === r ? "selected" : ""}>${esc(r)}</option>`).join("")}</select>
      <input class="inp" id="fQ" placeholder="Buscar tarea…" value="${esc(filt.q)}" style="flex:1;min-width:160px">
    </div>
    ${canWrite ? `<form class="card add" id="addForm">
      <input class="inp" id="aTexto" placeholder="Nueva tarea (corta, qué se entrega)" required>
      <select class="inp" id="aFrente" aria-label="Frente">${S.frentes.sort(byOrden).map((f) => `<option value="${esc(f.id)}" ${filt.frente === f.id ? "selected" : ""}>${esc(f.nombre)}</option>`).join("")}</select>
      <input class="inp" id="aResp" list="dlPersonas" placeholder="Responsable">
      <input class="inp" id="aFecha" type="date" aria-label="Fecha compromiso">
      <button class="btn pri" type="submit">Agregar</button>
    </form>` : ""}
    <div class="kanban">${cols}</div>
    ${personasDL()}
  </section>`;
}
function personasDL() { return `<datalist id="dlPersonas">${S.personas.sort(byOrden).map((p) => `<option value="${esc(p.nombre)}">${esc(p.rol || "")}</option>`).join("")}</datalist>`; }
function taskCard(t) {
  return `<div class="tk" data-task="${esc(t.id)}" ${canWrite ? 'draggable="true"' : ""} role="button" tabindex="0">
    <div class="top-r">${canWrite ? `<button class="chk ${t.estado === "hecha" ? "on" : ""}" data-done="${esc(t.id)}" aria-label="Marcar como hecha">✓</button>` : ""}<div class="tt">${esc(t.texto)}</div></div>
    ${t.estado === "atorada" && t.motivo ? `<div class="motivo">${esc(t.motivo)}</div>` : ""}
    <div class="mt">${filt.frente === "todos" ? `<span class="chip-f"><span class="fdot" style="background:${fcol(t.frente)}"></span>${esc(fname(t.frente))}</span>` : ""}${t.responsable ? `<span>${esc(t.responsable)}</span>` : ""}${t.fecha ? `<span class="dt mono${late(t) ? " late" : ""}">${fmt(t.fecha)}${late(t) ? " · vencida" : ""}</span>` : ""}${t.hecha_at ? `<span class="mono">✓ ${fmt(t.hecha_at)}</span>` : ""}</div>
  </div>`;
}

// Semanas
function vSemanas() {
  const t = today(); const cur = monday(t);
  const keys = new Set(S.semanas.map((s) => s.id)); keys.add(iso(cur));
  const list = [...keys].sort().reverse();

function semanaTexto(k) {
  const s = S.semanas.find((x) => x.id === k) || {}; const a = parse(k), b = addDays(a, 7);
  const hechas = S.tareas.filter((x) => x.hecha_at && new Date(x.hecha_at) >= a && new Date(x.hecha_at) < b);
  const g = statsGlobal();
  let out = `Implementación de Odoo · Semana ${weekNum(a)} (${fmt(k)} – ${fmtY(iso(addDays(a, 4)))})\n\n`;
  if (s.resumen) out += s.resumen + "\n\n";
  out += `Avance general: ${g.pct}% (${g.hecha} de ${g.total} tareas). Atoradas o vencidas: ${g.atorada + g.late}.\n\n`;
  out += "Frentes:\n" + S.frentes.sort(byOrden).map((f) => { const c = statsFrente(f.id); return `- ${f.nombre}: ${SEM[f.semaforo] || ""}, ${c.pct}%${f.semaforo !== "verde" && f.motivo ? ". " + f.motivo : ""}`; }).join("\n") + "\n\n";

  };
}
function speechDict() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return null;
  let rec = null; const hs = { p: [], f: [], s: [] };
  const emit = (k, v) => hs[k].forEach((fn) => fn(v));
  return {
    start() { return new Promise((res, rej) => {
      rec = new SR(); rec.lang = "es-MX"; rec.continuous = true; rec.interimResults = true;
      rec.onstart = () => { emit("s", { state: "listening" }); res(); };
      rec.onresult = (e) => { let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) emit("f", { text: r[0].transcript.trim() }); else interim += r[0].transcript; } emit("p", { text: interim }); };
      rec.onerror = (ev) => { if (ev.error === "not-allowed" || ev.error === "service-not-allowed") rej({ code: "not_granted" }); };
      rec.onend = () => emit("s", { state: "idle" });
      try { rec.start(); } catch (err) { rej({ code: "unavailable" }); }
    }); },
    stop() { try { rec && rec.stop(); } catch {} return Promise.resolve(); },
    onPartial(fn) { hs.p.push(fn); }, onFinal(fn) { hs.f.push(fn); }, onState(fn) { hs.s.push(fn); },
  };
}
function initDictado() {
  const d = speechDict(); if (!d) return;
  dict = d;
  d.onPartial(({ text }) => { const p = $("#nParcial"); if (p) p.textContent = text; });
  d.onFinal(({ text }) => { const t = $("#nTexto"); borrador = ((t ? t.value : borrador) + (borrador && !/\s$/.test(borrador) ? " " : "") + text).trimStart(); if (t) { t.value = borrador; t.scrollTop = t.scrollHeight; } const p = $("#nParcial"); if (p) p.textContent = ""; });
  d.onState(({ state }) => { const on = state === "listening" || state === "starting"; if (on !== dictOn) { dictOn = on; const m = $("#nMic"); if (m) { m.classList.toggle("on", on); m.innerHTML = `<span class="rec"></span>${on ? "Detener dictado" : "Dictar"}`; } } });
}

}

  if (e && e.code === "auth") { salirEdicion(); toast("La llave de edición ya no es válida. Pide a Juan Carlos que la renueve."); return; }
  toast(`No se pudo guardar${e && e.code ? " (" + e.code + ")" : ""}. Tu texto sigue ahí; inténtalo otra vez en unos segundos.`);

async function saveTask(t, patch) {
  if (patch.estado === "hecha" && t.estado !== "hecha") patch.hecha_at = nowISO();
  if (patch.estado && patch.estado !== "hecha" && t.estado === "hecha") patch.hecha_at = "";
  if (patch.estado && patch.estado !== "atorada" && !("motivo" in patch)) patch.motivo = t.motivo || "";
  let msg = "";
  if (patch.estado && patch.estado !== t.estado) msg = `${EST[patch.estado]}: ${patch.texto || t.texto}`;
  else if (patch.fecha !== undefined && patch.fecha !== t.fecha) msg = `Nueva fecha (${fmt(patch.fecha) || "sin fecha"}): ${t.texto}`;
  else if (patch.responsable !== undefined && patch.responsable !== t.responsable) msg = `Responsable ${patch.responsable || "sin asignar"}: ${t.texto}`;
  else msg = `Editada: ${patch.texto || t.texto}`;
  Object.assign(t, patch); render();
  await write(`tareas/${t.id}`, patch, msg, patch.frente || t.frente, t.id);
}

// ---------- Almacenamiento en GitHub ----------
const GH = { owner: "JuanArandaEstriba", repo: "odoo-priat-tablero", branch: "main", path: "data/tablero.enc.json" };
const EDITORES = [
  { id: "juan", nombre: "Juan Carlos", foto: "img/juan.jpg", color: "#2446a6" },
  { id: "ivan", nombre: "Iván", foto: "img/ivan.jpg", color: "#0f8a7e" },
  { id: "aaron", nombre: "Aarón", foto: "img/aaron.jpg", color: "#c2602a" },
];
let RAW = null, fileSha = null, token = null, editor = null, loadError = false, DK = null, lockError = "";
// ---------- Cifrado (AES-GCM; la llave de datos se protege con PBKDF2) ----------
const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64u8 = (u) => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
async function pwKey(pw, salt, iter) { const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); }
async function unwrap(obj, pw) { const k = await pwKey(pw, u8(obj.salt), obj.iter); try { return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(obj.iv) }, k, u8(obj.ct))); } catch { throw { code: "pass" }; } }
async function setDK(rawB64, recordar) { DK = await crypto.subtle.importKey("raw", u8(rawB64), "AES-GCM", false, ["encrypt", "decrypt"]); try { (recordar ? localStorage : sessionStorage).setItem("dk-odoo", rawB64); } catch {} }
async function decData(enc) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(enc.iv) }, DK, u8(enc.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
async function encData(raw) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, DK, new TextEncoder().encode(JSON.stringify(raw)))); return { v: 1, iv: b64u8(iv), ct: b64u8(ct) }; }
let pending = [], flushing = false, flushTimer = null;
const API = `https://api.github.com/repos/${GH.owner}/${GH.repo}`;

function avatar(id, lg) {
  const e = EDITORES.find((x) => x.id === id); const nom = who(id);
  const col = e ? e.color : (id === "claude" ? "var(--fg)" : "var(--faint)");
  const ini = esc(initials(nom));
  if (e && e.foto && fotosOk[e.id]) return `<img class="ava${lg ? " lg" : ""}" src="${esc(e.foto)}" alt="${esc(nom)}">`;
  return `<span class="ava${lg ? " lg" : ""}" style="background:${col}" title="${esc(nom)}">${id === "claude" ? "C" : ini}</span>`;
}
const fotosOk = {};
EDITORES.forEach((e) => { const i = new Image(); i.onload = () => { fotosOk[e.id] = true; safeRender(); renderQuien(); }; i.src = e.foto; });

function b64encode(str) { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64decode(b64) { const bin = atob(b64.replace(/\s/g, "")); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function ghHeaders() { return { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }; }

function applyState() {
  COLS.forEach((c) => { S[c] = Object.entries((RAW && RAW[c]) || {}).map(([id, d]) => ({ id, ...d })); loaded.add(c); });
}
async function fetchAuth() {
  const r = await fetch(`${API}/contents/${GH.path}?ref=${GH.branch}&t=${Date.now()}`, { headers: ghHeaders(), cache: "no-store" });
  if (r.status === 401 || r.status === 403) throw { code: "auth" };
  if (!r.ok) throw { code: "net" };
  const j = await r.json();
  let txt;
  if (j.content) txt = b64decode(j.content);
  else { const r2 = await fetch(`${API}/git/blobs/${j.sha}`, { headers: ghHeaders() }); txt = b64decode((await r2.json()).content); }
  return { raw: await decData(JSON.parse(txt)), sha: j.sha };
}
async function cargar() {
  if (pending.length || flushing || !DK) return;
  try {
    if (token) { const { raw, sha } = await fetchAuth(); RAW = raw; fileSha = sha; }
    else { const r = await fetch(`${GH.path}?t=${Date.now()}`, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); RAW = await decData(await r.json()); }
    loadError = false; applyState(); safeRender();
  } catch (e) {
    if (e && e.code === "auth") { failed(e); return; }
    if (!RAW) { loadError = true; render(); }
  }
}
function applyOp(raw, o) {
  raw[o.col] = raw[o.col] || {};
  if (o.t === "delete") delete raw[o.col][o.id];
  else if (o.t === "set") raw[o.col][o.id] = o.d;
  else raw[o.col][o.id] = { ...(raw[o.col][o.id] || {}), ...o.d };
}
function enqueue(o) {
  if (!token) return Promise.reject({ code: "readonly" });
  RAW = RAW || {}; applyOp(RAW, o); applyState();
  return new Promise((resolve, reject) => {
    pending.push({ ...o, resolve, reject });
    clearTimeout(flushTimer); flushTimer = setTimeout(flush, 900);
  });
}
async function flush() {
  if (flushing || !pending.length) return;
  flushing = true; const ops = pending.splice(0);
  const textos = ops.filter((o) => o.col === "actividad" && o.d && o.d.texto).map((o) => o.d.texto);
  const msg = `${editor ? editor.nombre : "Tablero"}: ${textos.length ? textos.join(" · ").slice(0, 300) : "cambios en el tablero"}`;
  try {
    let ok = false;
    for (let intento = 0; intento < 6 && !ok; intento++) {
      if (intento) await new Promise((r) => setTimeout(r, 800 * intento + Math.random() * 600));
      const { raw, sha } = await fetchAuth();
      ops.forEach((o) => applyOp(raw, o));
      const acts = Object.entries(raw.actividad || {}).sort((a, b) => (b[1].at || "").localeCompare(a[1].at || ""));
      if (acts.length > 800) raw.actividad = Object.fromEntries(acts.slice(0, 800));
      raw.actualizado = nowISO();
      const r = await fetch(`${API}/contents/${GH.path}`, { method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, content: b64encode(JSON.stringify(await encData(raw))), sha, branch: GH.branch,
          author: { name: `${editor ? editor.nombre : "Tablero"} (tablero)`, email: "tablero-odoo@users.noreply.github.com" } }) });
      if (r.ok) { const j = await r.json(); fileSha = j.content.sha; RAW = raw; ops.forEach((o) => applyOp(RAW, o)); ok = true; }
      else if (r.status === 401 || r.status === 403) throw { code: "auth" };
      else if (r.status !== 409 && r.status !== 422) throw { code: "net" };
    }
    if (!ok) throw { code: "net" };
    applyState(); safeRender(); ops.forEach((o) => o.resolve());
  } catch (e) { ops.forEach((o) => o.reject(e)); cargar(); }
  flushing = false;
  if (pending.length) flush();
}
const db = {
  doc(path) { const [col, id] = path.split("/"); return {
    update: (d) => enqueue({ t: "update", col, id, d }),
    set: (d) => enqueue({ t: "set", col, id, d }),
    delete: () => enqueue({ t: "delete", col, id }),
  }; },
  collection(col) { return { add: (d) => { const id = col.slice(0, 1) + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); return enqueue({ t: "set", col, id, d }).then(() => ({ id })); } }; },
};

async function descifrarLlave(pass) {
  const r = await fetch(`llave.json?t=${Date.now()}`, { cache: "no-store" });
  if (!r.ok) throw { code: "sin_llave" };
  const k = await r.json();
  const un = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: un(k.salt), iterations: k.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  try { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: un(k.iv) }, key, un(k.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
  catch { throw { code: "pass" }; }
}
function abrirEditar() {
  let sel = (() => { try { return localStorage.getItem("editor-odoo") || ""; } catch { return ""; } })();
  openDrawer("Entrar a editar", `
    <p class="muted" style="margin:0">Elige quién eres. Todo lo que cambies quedará a tu nombre, con fecha y hora.</p>
    <div class="quien-pick">${EDITORES.map((e) => `<button type="button" data-ed="${e.id}" class="${sel === e.id ? "on" : ""}">${avatar(e.id, true)}<span>${esc(e.nombre)}</span></button>`).join("")}</div>
    <div class="fld"><label for="edPass">Contraseña de edición</label><input class="inp" id="edPass" type="password" autocomplete="current-password"></div>
    <p class="err" id="edErr"></p>`,
    `<span></span><span style="display:flex;gap:8px"><button class="btn" data-close-d>Cancelar</button><button class="btn pri" id="edOk">Entrar</button></span>`);
  $("#layer").querySelectorAll("[data-close-d]").forEach((el) => el.onclick = closeDrawer);
  $("#layer").querySelectorAll("[data-ed]").forEach((b) => b.onclick = () => { sel = b.dataset.ed; $("#layer").querySelectorAll("[data-ed]").forEach((x) => x.classList.toggle("on", x === b)); $("#edPass").focus(); });
  const go = async () => {
    const err = $("#edErr"); if (!sel) { err.textContent = "Elige quién eres."; return; }
    const pass = $("#edPass").value; if (!pass) { err.textContent = "Escribe la contraseña."; return; }
    $("#edOk").disabled = true; err.textContent = "";
    try {
      const ll = await descifrarLlave(pass); const tk = ll.tk; if (!tk) throw { code: "sin_token" };
      if (!DK) await setDK(ll.dk, false);
      const r = await fetch(API, { headers: { Authorization: `Bearer ${tk}`, Accept: "application/vnd.github+json" } });
      if (!r.ok) throw { code: "auth" };
      token = tk; editor = EDITORES.find((x) => x.id === sel); meId = editor.id; canWrite = true;
      try { sessionStorage.setItem("tk-odoo", tk); localStorage.setItem("editor-odoo", sel); } catch {}
      closeDrawer(); renderQuien(); toast(`Editando como ${editor.nombre}`); await cargar(); render();
    } catch (e) {
      err.textContent = e.code === "pass" ? "Contraseña incorrecta." : e.code === "sin_token" ? "Falta conectar la llave de GitHub (configurar.html → Cambiar llave o contraseñas)." : e.code === "sin_llave" ? "Todavía no se configura la llave de edición." : "La llave de edición no funciona. Hay que renovarla.";
      $("#edOk").disabled = false;
    }
  };
  $("#edOk").onclick = go;
  $("#edPass").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
function salirEdicion() {
  token = null; editor = null; meId = null; canWrite = false;
  try { sessionStorage.removeItem("tk-odoo"); } catch {}
  renderQuien(); render();
}
function renderQuien() {
  const q = $("#quien");
  q.innerHTML = editor
    ? `<span class="yo">${avatar(editor.id)}${esc(editor.nombre)}</span><button class="btn sm" id="btnSalir">Salir</button>`
    : `<button class="btn sm pri" id="btnEditar">Editar</button>`;
  const b1 = $("#btnEditar"); if (b1) b1.onclick = abrirEditar;
  const b2 = $("#btnSalir"); if (b2) b2.onclick = salirEdicion;
}

// Estado completo en texto, para pegarlo en Claude
function textoParaClaude() {
  const g = statsGlobal(); const t = today();
  let o = `# Tablero de implementación de Odoo · Grupo PRIAT\nCorte: ${fmtY(iso(t))}. Avance general: ${g.pct}% (${g.hecha} de ${g.total} tareas). Atoradas o vencidas: ${g.atorada + g.late}.\n\n`;
  o += "## Indicadores\n" + S.indicadores.sort(byOrden).map((i) => `- ${i.nombre}: ${num(i.valor)}${i.meta != null ? ` (meta ${num(i.meta)})` : ""} · ${i.fuente}`).join("\n") + "\n\n";
  S.frentes.sort(byOrden).forEach((f) => {
    const c = statsFrente(f.id);
    o += `## ${f.nombre} · ${SEM[f.semaforo] || ""} · ${c.pct}%\nLíder: ${f.lider || "—"}. Meta: ${f.meta || "—"}${f.motivo ? `\nRiesgo: ${f.motivo}` : ""}\n`;
    o += "Etapas:\n" + S.etapas.filter((e) => e.frente === f.id).sort(byOrden).map((e) => `- ${e.nombre}: ${e.estado}, ${e.inicio} a ${e.fin}${e.confirmada ? "" : " (por confirmar)"}`).join("\n") + "\n";
    const abiertas = S.tareas.filter((x) => x.frente === f.id && x.estado !== "hecha");
    if (abiertas.length) o += "Tareas abiertas:\n" + abiertas.map((x) => `- [${EST[x.estado]}] ${x.texto}${x.responsable ? " · " + x.responsable : ""}${x.fecha ? " · " + x.fecha + (late(x) ? " (vencida)" : "") : ""}${x.motivo ? " · Motivo: " + x.motivo : ""}`).join("\n") + "\n";
    o += "\n";
  });
  o += "## Decisiones pendientes\n" + S.decisiones.filter((d) => d.estado !== "decidida").map((d) => `- ${d.texto} (decide: ${d.quien || "—"})`).join("\n") + "\n";
  return o;
}

// No redibuja mientras alguien escribe en la página; espera a que salga del campo.
// Tema claro / oscuro / sistema (preferencia de quien ve, en su navegador)
const TEMAS = ["", "light", "dark"], TN = { "": "Tema del sistema", light: "Tema claro", dark: "Tema oscuro" };
function aplicaTema(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); $("#tema").title = TN[t]; $("#tema").textContent = t === "light" ? "☀" : t === "dark" ? "☾" : "◐"; }
let tema = ""; try { tema = localStorage.getItem("tema-odoo") || ""; } catch {}
if (tema) aplicaTema(tema); else $("#tema").title = TN[""];
$("#tema").onclick = () => { tema = TEMAS[(TEMAS.indexOf(tema) + 1) % 3]; aplicaTema(tema); try { localStorage.setItem("tema-odoo", tema); } catch {} toast(TN[tema]); };
async function boot() {
  try { const dk = localStorage.getItem("dk-odoo") || sessionStorage.getItem("dk-odoo"); if (dk) await setDK(dk, !!localStorage.getItem("dk-odoo")); } catch {}
  route(); renderQuien(); initDictado();
  try { const tk = sessionStorage.getItem("tk-odoo"); const ed = localStorage.getItem("editor-odoo"); if (tk && ed) { token = tk; editor = EDITORES.find((x) => x.id === ed) || null; if (editor) { meId = editor.id; canWrite = true; } else token = null; } } catch {}
  renderQuien();
  await cargar();
  setInterval(() => { if (document.visibilityState === "visible") cargar(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") cargar(); });
  $("#btnCerrar").onclick = () => { cerrarCandado(); render(); toast("Sesión cerrada en este equipo"); };
  $("#paraClaude").onclick = async () => { if (!DK || !RAW) { toast("Primero escribe la contraseña para ver"); return; } const txt = textoParaClaude(); try { await navigator.clipboard.writeText(txt); toast("Copiado. Pégalo en Claude."); } catch { openDrawer("Para Claude", `<textarea class="inp" style="min-height:60vh;font-size:12.5px" readonly>${esc(txt)}</textarea>`, `<span class="faint">Selecciona y copia el texto.</span><button class="btn" data-close-d>Cerrar</button>`); $("#layer").querySelectorAll("[data-close-d]").forEach((el) => el.onclick = closeDrawer); } };
}
window.addEventListener("beforeunload", (e) => { if (pending.length || flushing) { e.preventDefault(); e.returnValue = ""; } });
boot();
})();
